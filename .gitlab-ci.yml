image: "ghcr.io/cirruslabs/flutter:3.41.4"
# https://github.com/cirruslabs/docker-images-flutter/pkgs/container/flutter

variables:
  PUB_VARS: "--timeout 30s --concurrency=6 --test-randomize-ordering-seed=random --reporter=expanded"
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  FLUTTER_ROOT: "/sdks/flutter"

# Global cache configuration - shares dependencies across all jobs
cache:
  key:
    files:
      - client/pubspec.lock
      - server/pubspec.lock
  paths:
    - .pub-cache/
    - client/.dart_tool/
    - server/.dart_tool/
  policy: pull

prepare_dependencies:
  stage: .pre
  cache:
    key:
      files:
        - client/pubspec.lock
        - server/pubspec.lock
    paths:
      - .pub-cache/
      - client/.dart_tool/
      - server/.dart_tool/
    policy: pull-push
  script:
    - cd client && flutter pub get --precompile
    - cd ../server && dart pub get

build_client:
  stage: build
  needs: [prepare_dependencies]
  script:
    - set -e
    - cd client
    - flutter --version
    - flutter config --enable-web
    - flutter pub get --precompile
    - flutter build web --release
    # set ownership to `gitlab-runner` user on schedule-vm server
    # https://gitlab.cs.wallawalla.edu/wwu/schedule/-/issues/106
    - chown 998:998 -R build/web
  artifacts:
    paths:
      - client/build/web/

build_server:
  stage: build
  needs: [prepare_dependencies]
  script:
    - set -e
    - cd server
    - dart pub get
    - dart compile exe -o api_server --target-os linux bin/server.dart
    # set ownership to `gitlab-runner` user on schedule-vm server
    # https://gitlab.cs.wallawalla.edu/wwu/schedule/-/issues/106
    - chown 998:998 /builds/wwu/schedule/server/api_server
  artifacts:
    paths:
      - server/api_server

lint_client:
  stage: test
  needs: [prepare_dependencies]
  script:
    - cd client
    - dart format --output=none --set-exit-if-changed .
    - flutter analyze

lint_server:
  stage: test
  needs: [prepare_dependencies]
  script:
    - cd server
    - dart pub get
    - dart format --output=none --set-exit-if-changed .
    - dart analyze

test_client:
  stage: test
  needs: [prepare_dependencies]
  script:
    - cd client
    - flutter --version
    - flutter test  $PUB_VARS --machine --coverage --concurrency=1
    - lcov --summary coverage/lcov.info
    - genhtml coverage/lcov.info --output=coverage

test_server:
  stage: test
  needs: [prepare_dependencies]
  script:
    - cd server
    - dart test $PUB_VARS

deploy_to_dokku:
  stage: deploy
  image: gitlab.cs.wallawalla.edu:5050/cs_department/docker-images/ssh_deploy
  variables:
    GIT_DEPTH: 0
  before_script:
    - mkdir -p ~/.ssh
    - echo "$DOKKU_SSH_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H production.cs.wallawalla.edu >> ~/.ssh/known_hosts
  script:
    - git remote add dokku dokku@production.cs.wallawalla.edu:$DOKKU_APP
    - git checkout -B ci
    - 'sed -i "s/^version:.*/version: ${CI_COMMIT_TAG#v}+${CI_COMMIT_SHORT_SHA}/" web_client/pubspec.yaml'
    - 'sed -i "s/const String version = .*/const String version = ''${CI_COMMIT_TAG#v}+${CI_COMMIT_SHORT_SHA}'';/" common/lib/version.dart'
    - git config user.email "ci@gitlab.cs.wallawalla.edu"
    - git config user.name "GitLab CI"
    - git add web_client/pubspec.yaml api_server/pubspec.yaml common/lib/version.dart
    - git commit -m "Set version to ${CI_COMMIT_TAG#v}+${CI_COMMIT_SHORT_SHA}"
    - git push -f dokku ci:main
  environment:
    name: production
    url: https://$DOKKU_APP.cs.wallawalla.edu
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

staging_to_dokku:
  stage: deploy
  image: gitlab.cs.wallawalla.edu:5050/cs_department/docker-images/ssh_deploy
  variables:
    GIT_DEPTH: 0
  before_script:
    - mkdir -p ~/.ssh
    - echo "$DOKKU_SSH_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H staging.cs.wallawalla.edu >> ~/.ssh/known_hosts
  script:
    - git remote add dokku dokku@staging.cs.wallawalla.edu:$DOKKU_APP
    - git checkout -B ci
    - 'sed -i "s/^version:.*/version: 0.0.${CI_MERGE_REQUEST_IID#v}+${CI_COMMIT_SHORT_SHA}/" web_client/pubspec.yaml'
    - 'sed -i "s/const String version = .*/const String version = ''MR${CI_MERGE_REQUEST_IID#v}+${CI_COMMIT_SHORT_SHA}'';/" common/lib/version.dart'
    - git config user.email "ci@gitlab.cs.wallawalla.edu"
    - git config user.name "GitLab CI"
    - git add web_client/pubspec.yaml api_server/pubspec.yaml common/lib/version.dart
    - git commit -m "Set version to MR${CI_MERGE_REQUEST_IID}+${CI_COMMIT_SHORT_SHA}"
    - git push -f dokku ci:main
  environment:
    name: staging
    url: https://$DOKKU_APP.staging.cs.wallawalla.edu
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual

