image: "ghcr.io/cirruslabs/flutter:3.41.4"
# https://github.com/cirruslabs/docker-images-flutter/pkgs/container/flutter

variables:
  PUB_VARS: "--timeout 30s --concurrency=6 --test-randomize-ordering-seed=random --reporter=expanded"
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  FLUTTER_ROOT: "/sdks/flutter"

# Global cache configuration - shares dependencies across all jobs
cache:
  key:
    files:
      - client/pubspec.lock
      - server/pubspec.lock
  paths:
    - .pub-cache/
    - client/.dart_tool/
    - server/.dart_tool/
  policy: pull

prepare_dependencies:
  stage: .pre
  cache:
    key:
      files:
        - client/pubspec.lock
        - server/pubspec.lock
    paths:
      - .pub-cache/
      - client/.dart_tool/
      - server/.dart_tool/
    policy: pull-push
  script:
    - cd client && flutter pub get --precompile
    - cd ../server && dart pub get

build_client:
  stage: build
  needs: [prepare_dependencies]
  script:
    - set -e
    - cd client
    - flutter --version
    - flutter config --enable-web
    - flutter pub get --precompile
    - flutter build web --release
    # set ownership to `gitlab-runner` user on schedule-vm server
    # https://gitlab.cs.wallawalla.edu/wwu/schedule/-/issues/106
    - chown 998:998 -R build/web
  artifacts:
    paths:
      - client/build/web/

build_server:
  stage: build
  needs: [prepare_dependencies]
  script:
    - set -e
    - cd server
    - dart pub get
    - dart compile exe -o api_server --target-os linux bin/server.dart
    # set ownership to `gitlab-runner` user on schedule-vm server
    # https://gitlab.cs.wallawalla.edu/wwu/schedule/-/issues/106
    - chown 998:998 /builds/wwu/schedule/server/api_server
  artifacts:
    paths:
      - server/api_server

lint_client:
  stage: test
  needs: [prepare_dependencies]
  script:
    - cd client
    - dart format --output=none --set-exit-if-changed .
    - flutter analyze

lint_server:
  stage: test
  needs: [prepare_dependencies]
  script:
    - cd server
    - dart pub get
    - dart format --output=none --set-exit-if-changed .
    - dart analyze

test_client:
  stage: test
  needs: [prepare_dependencies]
  script:
    - cd client
    - flutter --version
    - flutter test  $PUB_VARS --machine --coverage --concurrency=1
    - lcov --summary coverage/lcov.info
    - genhtml coverage/lcov.info --output=coverage

test_server:
  stage: test
  needs: [prepare_dependencies]
  script:
    - cd server
    - dart test $PUB_VARS

deploy:
  stage: deploy
  tags:
    - schedule
  script:
    - sudo /bin/systemctl stop api_server.service
    - rsync -av --delete client/build/web/ /var/www/html/
    - cp server/api_server /opt/api_server
    - sudo /bin/systemctl restart api_server.service
  environment:
    name: production
    url: https://schedule.cs.wallawalla.edu
  only:
    - main
  when: manual
