---
default:
  image: gitlab-registry.cs.wallawalla.edu/cs_department/docker-images/flutter:latest
  before_script:
    - dart --version
    - flutter --version
    - dart format --version
    - export PUB_CACHE=$CI_PROJECT_DIR/.pub-cache
    - export PATH="$PATH":"$PUB_CACHE/bin"

variables:
  PUB_VARS: "--timeout 30s --concurrency=6 --test-randomize-ordering-seed=random --reporter=expanded"

stages:
  - test
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

client:
  stage: test
  cache:
    key:
      files:
        - client/pubspec.lock
    paths:
      - $CI_PROJECT_DIR/.pub-cache/
  script:
    - cd client
    - flutter pub get
    - echo "==================== dart format ===================="
    - dart format --output=none --set-exit-if-changed . || FORMAT=1
    - echo "==================== flutter analyze ===================="
    - flutter analyze || ANALYZE=1
    - echo "==================== flutter test ===================="
    - flutter test $PUB_VARS --coverage && lcov --list coverage/lcov.info && genhtml coverage/lcov.info --output=coverage || TEST=1
    - echo "==================== SUMMARY ===================="
    - '[ -z "$FORMAT"  ] && echo "  PASS  format"  || echo "  FAIL  format"'
    - '[ -z "$ANALYZE" ] && echo "  PASS  analyze" || echo "  FAIL  analyze"'
    - '[ -z "$TEST"    ] && echo "  PASS  test"    || echo "  FAIL  test"'
    - if [ -n "${FORMAT}${ANALYZE}${TEST}" ]; then exit 1; fi
  coverage: '/\s*lines.*:\s*([0-9.]+%)/'
  artifacts:
    paths:
      - client/coverage

server:
  stage: test
  cache:
    key:
      files:
        - server/pubspec.lock
    paths:
      - $CI_PROJECT_DIR/.pub-cache/
  script:
    - cd server
    - dart pub get
    - echo "==================== dart format ===================="
    - dart format --output=none --set-exit-if-changed . || FORMAT=1
    - echo "==================== dart analyze ===================="
    - dart analyze || ANALYZE=1
    - echo "==================== dart test ===================="
    - dart test $PUB_VARS || TEST=1
    - echo "==================== SUMMARY ===================="
    - '[ -z "$FORMAT"  ] && echo "  PASS  format"  || echo "  FAIL  format"'
    - '[ -z "$ANALYZE" ] && echo "  PASS  analyze" || echo "  FAIL  analyze"'
    - '[ -z "$TEST"    ] && echo "  PASS  test"    || echo "  FAIL  test"'
    - if [ -n "${FORMAT}${ANALYZE}${TEST}" ]; then exit 1; fi

deploy_to_dokku:
  stage: deploy
  image: gitlab-registry.cs.wallawalla.edu/cs_department/docker-images/ssh_deploy
  variables:
    GIT_DEPTH: 0
  before_script:
    - mkdir -p ~/.ssh
    - echo "$DOKKU_SSH_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H production.cs.wallawalla.edu >> ~/.ssh/known_hosts
  script:
    - git remote add dokku dokku@production.cs.wallawalla.edu:$DOKKU_APP
    - git checkout -B ci
    - git push -f dokku ci:main
  environment:
    name: production
    url: https://$DOKKU_APP.cs.wallawalla.edu
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

staging_to_dokku:
  stage: deploy
  image: gitlab-registry.cs.wallawalla.edu/cs_department/docker-images/ssh_deploy
  variables:
    GIT_DEPTH: 0
  before_script:
    - mkdir -p ~/.ssh
    - echo "$DOKKU_SSH_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H staging.cs.wallawalla.edu >> ~/.ssh/known_hosts
  script:
    - git remote add dokku dokku@staging.cs.wallawalla.edu:$DOKKU_APP
    - git checkout -B ci
    - git push -f dokku ci:main
  environment:
    name: staging
    url: https://$DOKKU_APP.staging.cs.wallawalla.edu
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
