image: "ghcr.io/cirruslabs/flutter:3.24.2"

variables:
  PUB_VARS: "--timeout 30s --concurrency=1 --test-randomize-ordering-seed=random --reporter=expanded"

build_client:
  stage: build
  script:
    - set -e
    - cd schedule_client
    - flutter --version
    - flutter config --enable-web
    - flutter pub get --precompile
    - flutter build web --release
  artifacts:
    paths:
      - schedule_client/build/web/

build_server:
  stage: build
  script:
    - set -e
    - cd schedule_server
    - dart pub get
    - dart compile exe -o schedule --target-os linux bin/schedule_server.dart
  artifacts:
    paths:
      - schedule_server/schedule

lint_client:
  stage: test
  script:
    - cd schedule_client
    - flutter clean
    - flutter pub get
    - dart analyze --fatal-infos

lint_server:
  stage: test
  script:
    - cd schedule_server
    - flutter clean
    - flutter pub get
    - dart analyze --fatal-infos

format_client:
  stage: test
  script:
    - cd schedule_client
    - dart format --set-exit-if-changed lib/ test/

format_server:
  stage: test
  script:
    - cd schedule_server
    - dart format --set-exit-if-changed lib/ test/

test_client:
  stage: test
  script:
    - cd schedule_client
    - flutter --version
    - flutter test  $PUB_VARS --machine --coverage --concurrency=1
    - lcov --summary coverage/lcov.info
    - genhtml coverage/lcov.info --output=coverage
  coverage: '/lines\.*: \d+\.\d+\%/'
  artifacts:
    name: coverage
    paths:
      - $CI_PROJECT_DIR/coverage
    reports:
      junit: report.xml

test_server:
  stage: test
  script:
    - cd schedule_server
    - dart test $PUB_VARS
  artifacts:
    name: coverage
    paths:
      - $CI_PROJECT_DIR/coverage
    reports:
      junit: report.xml

deploy:
  stage: deploy
  tags:
    - schedule
  script:
    - sudo /bin/systemctl stop schedule.service
    - rsync -av --delete schedule_client/build/web/ /var/www/html/
    - cp schedule_server/schedule /opt/
    - sudo /bin/systemctl restart schedule.service
  # only:
  #   - main
  when: manual
