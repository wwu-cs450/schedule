image: "ghcr.io/cirruslabs/flutter:3.32.1"
# https://github.com/cirruslabs/docker-images-flutter/pkgs/container/flutter

variables:
  PUB_VARS: "--timeout 30s --concurrency=1 --test-randomize-ordering-seed=random --reporter=expanded"

build_client:
  stage: build
  script:
    - set -e
    - cd client
    - flutter --version
    - flutter config --enable-web
    - flutter pub get --precompile
    - flutter build web --release
    # set ownership to `gitlab-runner` user on schedule-vm server
    # https://gitlab.cs.wallawalla.edu/wwu/schedule/-/issues/106
    - chown 998:998 -R build/web
  artifacts:
    paths:
      - client/build/web/

build_server:
  stage: build
  script:
    - set -e
    - cd server
    - dart pub get
    - dart compile exe -o api_server --target-os linux bin/server.dart
    # set ownership to `gitlab-runner` user on schedule-vm server
    # https://gitlab.cs.wallawalla.edu/wwu/schedule/-/issues/106
    - chown 998:998 /builds/wwu/schedule/server/api_server
  artifacts:
    paths:
      - server/api_server

lint_client:
  stage: test
  script:
    - cd client
    - flutter clean
    - flutter pub get
    - dart analyze --fatal-infos

lint_server:
  stage: test
  script:
    - cd server
    - flutter clean
    - flutter pub get
    - dart analyze --fatal-infos

format_client:
  stage: test
  script:
    - cd client
    - flutter pub get
    - dart format --set-exit-if-changed lib/ test/

format_server:
  stage: test
  script:
    - cd server
    - dart format --set-exit-if-changed lib/ test/

test_client:
  stage: test
  script:
    - cd client
    - flutter --version
    - flutter test  $PUB_VARS --machine --coverage --concurrency=1
    - lcov --summary coverage/lcov.info
    - genhtml coverage/lcov.info --output=coverage

test_server:
  stage: test
  script:
    - cd server
    - dart test $PUB_VARS

deploy:
  stage: deploy
  tags:
    - schedule
  script:
    - sudo /bin/systemctl stop api_server.service
    - rsync -av --delete client/build/web/ /var/www/html/
    - cp server/api_server /opt/api_server
    - sudo /bin/systemctl restart api_server.service
  only:
    - main
  when: manual
